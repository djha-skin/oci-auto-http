[package]
name = "oci-auto-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Serve OCI-backed byte trees over HTTP"

[[bin]]
name = "oci-auto-http"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.12"
url = "2.5.8"
thiserror = "2.0.20"
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
