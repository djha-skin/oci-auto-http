[package]
name = "oci-auto-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Serve OCI-backed byte trees over HTTP"
repository = "https://github.com/djha-skin/oci-auto-http"
documentation = "https://docs.rs/oci-auto-http"
exclude = [".beads/**", ".pi/**", ".github/**"]

[[bin]]
name = "oci-auto-http"
path = "src/main.rs"

[[test]]
name = "registry_client"
path = "tests/registry_client.rs"
required-features = ["registry-tests"]

[features]
registry-tests = []

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.12"
toml_edit = "0.25.13"
url = "2.5.8"
thiserror = "2.0.20"
zeroize = "1.9.0"
bytes = "1.12.1"
futures-util = "0.3.34"
fs2 = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
base64 = "0.22.1"
ring = "0.17.14"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util", "io-std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tempfile = "3.27.0"
httpdate = "1.0.3"
