name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Check release tag matches Cargo version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          test "$version" = "$manifest_version"
      - run: cross test --locked --target ${{ matrix.target }}
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: Assemble binary archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="oci-auto-http-${version}-${{ matrix.target }}.tar.gz"
          stage="dist/stage"
          mkdir -p "$stage/docs/decisions" "$stage/deploy"
          install -m 0755 "target/${{ matrix.target }}/release/oci-auto-http" "$stage/oci-auto-http"
          install -m 0644 README.md LICENSE Cargo.toml Cargo.lock config.example.toml Dockerfile compose.yaml .dockerignore "$stage/"
          install -m 0644 docs/OPERATIONS.md "$stage/docs/OPERATIONS.md"
          install -m 0644 docs/decisions/*.md "$stage/docs/decisions/"
          install -m 0644 deploy/oci-auto-http.service deploy/config.container.example.toml "$stage/deploy/"
          cp -R src "$stage/src"
          tar -C "$stage" -czf "dist/$archive" .
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/oci-auto-http-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
