services:
  oci-auto-http:
    build: .
    image: oci-auto-http:local
    command:
      - serve
      - --config
      - /etc/oci-auto-http/config.toml
      - --tls-cert
      - /run/secrets/server-chain.pem
      - --tls-key
      - /run/secrets/server-key.pem
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 384m
    ports:
      # Deliberately loopback-only. Do not publish publicly before deployment review.
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/config.toml:/etc/oci-auto-http/config.toml:ro,z
      - ./deploy/server-chain.pem:/run/secrets/server-chain.pem:ro,z
      - ./deploy/server-key.pem:/run/secrets/server-key.pem:ro,z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    # /healthz is intended for an external probe; the minimal image deliberately
    # does not add curl/wget solely for an in-container healthcheck.
