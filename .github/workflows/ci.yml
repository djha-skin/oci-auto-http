name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
      - run: target/release/oci-auto-http --help
      - run: target/release/oci-auto-http mount --config deploy/config.container.example.toml list

  container-smoke:
    name: Restricted container health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-container.sh

  linux-targets:
    name: Linux ${{ matrix.target }} build and smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross test --locked --lib --target ${{ matrix.target }}
      - run: cross test --locked --no-run --target ${{ matrix.target }}
      - run: cross run --locked --release --target ${{ matrix.target }} --bin oci-auto-http -- --help
      - run: cross build --locked --release --target ${{ matrix.target }}
